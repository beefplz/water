spring.application.name=water
server.port =7355
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driverClassName=org.mariadb.jdbc.Driver

# Real values come from env vars or ./secrets.properties (gitignored)
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

api.khoa-key=${KHOA_KEY}
api.kware-key=${KWARE_KEY}
api.triton-url=${TRITON_URL:http://localhost:16010}

server.servlet.session.timeout=30

#logging.level.org.springframework.cache=DEBUG
spring.cache.type=caffeine
spring.cache.cache-names=waterDataCache
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

management.endpoints.web.exposure.include=health,info,caches
