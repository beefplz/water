name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  compose:
    name: Docker Compose 기동 확인
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 이미지 빌드 및 기동
        run: docker compose up -d --build

      - name: 헬스 체크 대기
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:7355/actuator/health; then
              echo; exit 0
            fi
            sleep 2
          done
          echo "애플리케이션이 시작되지 않음"; exit 1

      # 실제 MariaDB에서 네이티브 쿼리(nursery 스키마)와 mldata 뷰가 동작하는지 확인
      - name: API 응답 확인
        run: |
          for path in "pdo?tankid=IW1" "pdoweek?tankid=IW1" "waterwithos?tankid=iw1" "mldata?tankid=iw1"; do
            echo "GET /api/$path"
            curl -fsS "http://localhost:7355/api/$path"; echo
          done

      - name: 실패 시 로그 출력
        if: failure()
        run: docker compose logs

      - name: 정리
        if: always()
        run: docker compose down -v
